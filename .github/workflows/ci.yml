name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java tests and API regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ebcdc_test_ci
          POSTGRES_USER: ebcdc
          POSTGRES_PASSWORD: ebcdc
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ebcdc -d ebcdc_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run Java tests
        run: mvn -B -f backend/pom.xml verify
      - name: Run HTTP regression tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/ebcdc_test_ci
          EBCDC_TEST_URL: http://localhost:8080
        run: |
          java -jar backend/target/assistant-0.1.0.jar > /tmp/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            code=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/providers || true)
            if [ "$code" = 401 ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/backend.log; exit 1; fi
          python3 scripts/test-api.py
      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
